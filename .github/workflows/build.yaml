name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    # strategy:
    #   matrix:
    #     node-version: [ 16.x ]

    steps:
    # $GITHUB_WORKSPACE
    - uses: actions/checkout@v3
      with:
        # last edit time
        fetch-depth: 0
    - name: Install Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 22
    # - name: Install PNPM
    #   run: |
    #     npm add -g pnpm
    - uses: pnpm/action-setup@v2
      name: Install pnpm
      id: pnpm-install
      with:
        version: 10
        run_install: false
    - name: Get pnpm store directory
      id: pnpm-cache
      run: |
        echo "::set-output name=pnpm_cache_dir::$(pnpm store path)"
    - name: Build Cache
      id: build-cache
      uses: actions/cache@v3
      with:
        path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Sharp Deps
      run: |
        #sudo apt-get update
        #sudo apt-get install -y libvips-dev glib2.0-dev --no-install-recommends

    - run: |
        #export CXX="$(which g++) $(pkg-config --cflags glib-2.0)"
        #npm install --verbose --platform=linux sharp
        cd site
        make ci
        cd -

      name: Build
    - run: cp -r site/build site/tech-build
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    - run: echo wener.me > site/build/CNAME
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    - name: Deploy wener.me Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: JamesIves/github-pages-deploy-action@releases/v4
      with:
        #GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        branch: gh-pages
        folder: site/build
        single-commit: true

    - run: echo wener.tech > site/tech-build/CNAME
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    - name: Check legacy deployment token
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      run: |
        if [[ -z "$ACCESS_TOKEN" ]]; then
          echo "::error::ACCESS_TOKEN is required for deployment to wenerme/wener.tech with Contents write access."
          exit 1
        fi
    - name: Deploy wener.tech Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
      with:
        # Cross-repository deployment requires a PAT with Contents write access to wenerme/wener.tech.
        # The source repository's GITHUB_TOKEN cannot replace this token.
        token: ${{ secrets.ACCESS_TOKEN }}
        branch: gh-pages
        folder: site/tech-build
        repository-name: wenerme/wener.tech
        force: false
